# dev 환경 — App 저장소의 build-and-promote.yml 이 main 푸시마다 newTag를 갱신하는 PR을 만든다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: todo-dev

resources:
  - ../../base

labels:
  - pairs:
      environment: dev

images:
  - name: asia-northeast3-docker.pkg.dev/ssu-agent-vertex-509708/suntaechung-repo/todo-backend:prod
    # 초기값 'prod'는 기존 deploy.yml이 올린 태그. 첫 승격 PR부터 커밋 SHA로 바뀐다.
    newTag: prod
