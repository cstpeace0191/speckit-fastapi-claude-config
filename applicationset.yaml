apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: todo-app
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - env: dev
          - env: stg
          - env: prod
  template:
    metadata:
      name: 'todo-{{env}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/cstpeace0191/speckit-fastapi-claude-config.git
        targetRevision: main
        path: 'overlays/{{env}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: 'todo-{{env}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
